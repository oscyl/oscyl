[package]
name = "oscyl-gtk"
description = "Oscyl for GNOME: library, editor and sync for hardware synths"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "oscyl-gtk"
path = "src/main.rs"

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_8"] }
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }
glib-unix = "0.22"
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_20"] }
oscyl-app = { path = "../../crates/oscyl-app" }
oscyl-core = { path = "../../crates/oscyl-core" }
oscyl-driver = { path = "../../crates/oscyl-driver" }
oscyl-logue = { path = "../../crates/drivers/logue" }
oscyl-minilogue-xd = { path = "../../crates/drivers/korg-minilogue-xd" }
oscyl-midi = { path = "../../crates/oscyl-midi" }
pango = { version = "0.22", features = ["v1_56"] }
pangocairo = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
glib-build-tools = "0.22.8"
serde_json = "1"
