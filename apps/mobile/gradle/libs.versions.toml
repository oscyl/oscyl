# Checked 2026-11-12 against Maven Central, Google Maven and the Gradle Plugin
# Portal, and against the Compose Multiplatform 1.12.2 release notes.
[versions]
kotlin = "2.4.21"
agp = "9.5.1"
compose-multiplatform = "1.12.2"
# Stable line. CMP 1.12.2 pairs with 1.12.0-alpha03 (a prerelease); only
# MaterialTheme and the colour schemes are used, which 1.9.0 has.
compose-material3 = "1.9.0"
uniffi = "1.3.4"
jna = "5.19.1"
junit = "4.13.2"
# JetBrains multiplatform builds, the versions CMP 1.12.2 recommends (also the newest stable).
navigation3 = "1.2.0"
material3-adaptive = "1.3.0"
activity-compose = "1.13.0"
# FileProvider for the share sheet; newest stable.
androidx-core = "1.19.1"
# JetBrains multiplatform build of lifecycle (ViewModel in commonMain), newest stable.
lifecycle = "2.11.0"
# Tests. Jetpack Compose 1.12.1 is what CMP 1.12.2 resolves to on Android.
androidx-compose = "1.12.1"
androidx-test-junit = "1.3.0"
robolectric = "4.17"
androidx-test-runner = "1.7.0"
roborazzi = "1.79.0"
# 0.10.0 is newer but binary-incompatible with Roborazzi 1.79 (built against 0.9.x).
composable-preview-scanner = "0.10.0"
# Third-party notices for the About page (Kotlin/Android dependencies), newest stable.
aboutlibraries = "15.3.0"
kotlinx-serialization = "1.13.0"
# Locks for code every platform shares (the MIDI link); the version Compose already resolves.
atomicfu = "0.33.0"
# The coroutines Compose 1.12 resolves; the iOS platform module waits on UIKit with them.
kotlinx-coroutines = "1.11.0"
# Baseline Profiles and frame benchmarks (:baselineprofile), newest stable.
benchmark = "1.5.0"
uiautomator = "2.4.1"
profileinstaller = "1.4.1"

android-compileSdk = "37"
android-targetSdk = "37"
android-minSdk = "26"
# One NDK for the Rust build and AGP (stripping): r30.
android-ndk = "30.0.16248370"

[libraries]
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }
compose-ui-backhandler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "compose-multiplatform" }
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-multiplatform" }
compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
# Only for its host builds of the UniFFI runtime's library (JVM unit tests).
uniffi-runtime-jvm = { module = "ch.ubique.uniffi:runtime-jvm", version.ref = "uniffi" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
junit = { module = "junit:junit", version.ref = "junit" }
navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
material3-adaptive = { module = "org.jetbrains.compose.material3.adaptive:adaptive", version.ref = "material3-adaptive" }
material3-adaptive-layout = { module = "org.jetbrains.compose.material3.adaptive:adaptive-layout", version.ref = "material3-adaptive" }
material3-adaptive-navigation = { module = "org.jetbrains.compose.material3.adaptive:adaptive-navigation", version.ref = "material3-adaptive" }
lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-core = { module = "androidx.core:core", version.ref = "androidx-core" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "androidx-compose" }
compose-ui-test-junit4-accessibility = { module = "androidx.compose.ui:ui-test-junit4-accessibility", version.ref = "androidx-compose" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "androidx-compose" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose-preview-scanner-support = { module = "io.github.takahirom.roborazzi:roborazzi-compose-preview-scanner-support", version.ref = "roborazzi" }
composable-preview-scanner = { module = "io.github.sergio-sastre.ComposablePreviewScanner:android", version.ref = "composable-preview-scanner" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }

benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidKotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
uniffi = { id = "ch.ubique.uniffi.plugin", version.ref = "uniffi" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
aboutlibraries = { id = "com.mikepenz.aboutlibraries.plugin", version.ref = "aboutlibraries" }
androidTest = { id = "com.android.test", version.ref = "agp" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
