org.gradle.jvmargs=-Xmx8g -Dfile.encoding=UTF-8
# The Kotlin daemon compiles the shared module for four targets: room for it.
kotlin.daemon.jvmargs=-Xmx4g
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail
org.gradle.parallel=true

kotlin.code.style=official
# The UniFFI bindings for iOS live in nativeMain and use commonized cinterop.
kotlin.mpp.enableCInteropCommonization=true
# iOS builds only on macOS (the bindings use cinterop): say nothing about it elsewhere.
kotlin.native.ignoreDisabledTargets=true
# :iosPlatform (no cinterop) compiles its iOS klibs on Linux too, so CI checks it there;
# :shared cannot (its UniFFI cinterop needs macOS) and says so in a warning.
kotlin.native.enableKlibsCrossCompilation=true

android.useAndroidX=true
# R8 compat mode, not full mode: with AGP 9.5's R8, full mode merges Compose singleton
# classes wrongly once shared-element transitions are in use, and ART rejects the
# result at start (VerifyError). Compat mode still shrinks, optimises and obfuscates.
android.enableR8.fullMode=false
