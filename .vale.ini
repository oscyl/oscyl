# Prose style for the documentation. scripts/ci.sh (stage "prose") and the
# book job of .github/workflows/ci.yml run
#   git ls-files '*.md' | xargs vale --minAlertLevel=warning
# The rules are in .github/styles/Oscyl. Vale skips code blocks and inline
# code.
StylesPath = .github/styles
MinAlertLevel = suggestion
Vocab = Oscyl

[*.md]
BasedOnStyles = Oscyl

# History and records keep their words: the release notes, the accepted
# decisions and proposals, and the standard code of conduct.
[{CHANGELOG.md,CODE_OF_CONDUCT.md,docs/adr/*.md,docs/rfcs/*.md}]
BasedOnStyles =

# The design system's source document follows the DESIGN.md format that
# design tools read: its section names and its dense descriptions. It keeps
# its sentences (proofread only).
[DESIGN.md]
Oscyl.SentenceLength = NO
Oscyl.Passive = NO
