[workspace]
members = ["crates/oscyl-*", "crates/drivers/*", "apps/linux"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
# Oldest Rust that builds the workspace (gtk-rs needs 1.92); CI checks it.
rust-version = "1.92"
license = "MIT OR Apache-2.0"
authors = ["Giuseppe Maggio <jertlok@proton.me>"]

[workspace.dependencies]
thiserror = "2"

# The oscillator engine's render runs in tests thousands of times
# (oscyl-engine-host): optimised, they take seconds, not minutes.
[profile.dev.package.oscyl-logue]
opt-level = 3

[profile.dev.package.oscyl-engine-host]
opt-level = 3
