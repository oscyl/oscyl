name: iOS

on:
  push:
    branches: [main]
    paths: ['apps/mobile/**', 'crates/**', 'Cargo.*', 'design/tokens.json', '.github/workflows/ios.yml']
  pull_request:
    paths: ['apps/mobile/**', 'crates/**', 'Cargo.*', 'design/tokens.json', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ios:
    name: ios
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      # Caches Gradle's user home and the build cache.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          build-root-directory: apps/mobile
      - name: Rust stable
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-ios,aarch64-apple-ios-sim
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Kotlin/Native tests on the simulator
        working-directory: apps/mobile
        run: ./gradlew --warning-mode=all :shared:iosSimulatorArm64Test :iosPlatform:iosSimulatorArm64Test
      # The Xcode build phase runs :shared:embedAndSignAppleFrameworkForXcode itself.
      # One iPhone simulator for the build and the smoke run: building for it, not a
      # generic destination, builds arm64 only (the framework's and the core's only
      # simulator slice; Config.xcconfig excludes x86_64 too).
      - name: Pick a simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in devices.items() if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")))')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Build the app for the simulator
        working-directory: apps/mobile/iosApp
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: >
          xcodebuild -project iosApp.xcodeproj -scheme iosApp
          -configuration Debug
          -destination "id=$UDID"
          -derivedDataPath build/derived
          ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
      # A smoke run: boot, install and launch, then block on the app's console until it
      # says it drew its first frame (a crash ends the console, and the step, at once),
      # and keep a screenshot.
      - name: Launch in the simulator
        working-directory: apps/mobile/iosApp
        timeout-minutes: 10
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/derived/Build/Products/Debug-iphonesimulator/Oscyl.app
          grep -q -m1 'Oscyl: first frame' < <(xcrun simctl launch --console-pty "$UDID" io.github.oscyl | tee app.log)
          xcrun simctl io "$UDID" screenshot oscyl-simulator.png
      - name: Upload the screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-simulator
          path: |
            apps/mobile/iosApp/oscyl-simulator.png
            apps/mobile/iosApp/app.log
          if-no-files-found: ignore
