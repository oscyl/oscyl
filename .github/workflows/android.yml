name: Android

on:
  push:
    branches: [main]
    paths: ['apps/mobile/**', 'crates/**', 'Cargo.*', 'design/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['apps/mobile/**', 'crates/**', 'Cargo.*', 'design/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    name: android
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Gradle toolchain (jvmToolchain(21)).
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Rust stable
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-linux-android,x86_64-linux-android
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # The NDK the Gradle build names (gradle/libs.versions.toml, android-ndk).
      - name: Install the NDK
        run: |
          ndk=$(sed -n 's/^android-ndk = "\(.*\)"/\1/p' apps/mobile/gradle/libs.versions.toml)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
      - name: Check, unit and screenshot tests, debug build
        working-directory: apps/mobile
        # --warning-mode=all, not fail: Kotlin 2.4.21 warns about its own iOS setup.
        run: >
          ./gradlew --warning-mode=all
          :shared:check :androidApp:testDebugUnitTest :androidApp:verifyRoborazziDebug
          :androidApp:assembleDebug
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roborazzi-diffs
          path: |
            apps/mobile/androidApp/build/outputs/roborazzi/
            apps/mobile/androidApp/build/reports/tests/
          if-no-files-found: ignore

  # Accessibility (ATF) checks on a headless emulator Gradle manages.
  accessibility:
    name: accessibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Rust stable
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-linux-android,x86_64-linux-android
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install the NDK
        run: |
          ndk=$(sed -n 's/^android-ndk = "\(.*\)"/\1/p' apps/mobile/gradle/libs.versions.toml)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # swiftshader_indirect: the runners have no GPU (locally the emulator
      # needs gpu=host instead; see androidApp/build.gradle.kts).
      - name: Managed-device accessibility tests
        working-directory: apps/mobile
        run: >
          ./gradlew --warning-mode=all :androidApp:pixel6Api34DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accessibility-reports
          path: apps/mobile/androidApp/build/reports/androidTests/
          if-no-files-found: ignore
