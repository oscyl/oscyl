name: Site

# Publishes site/ with the README's pictures to GitHub Pages.
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/images/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write # publish the site
      id-token: write # prove the deployment's origin
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assemble
        run: |
          mkdir -p _site/images
          cp site/* _site/
          cp docs/images/*.webp docs/images/social-preview.png _site/images/
          cp apps/linux/data/fonts/AlbertSans-Bold.ttf _site/
          cp apps/linux/data/icons/hicolor/scalable/apps/io.github.oscyl.Oscyl.svg _site/icon.svg
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
