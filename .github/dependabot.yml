version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /
    labels: [dependencies, no-changelog]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /apps/mobile
    labels: [dependencies, no-changelog]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      gradle:
        update-types: [minor, patch]
    ignore:
      # Roborazzi's preview support (1.79.0) is built against 0.9.x: 0.10.0 changed
      # ComposablePreview.invoke and every preview golden fails with NoSuchMethodError.
      # Take it together with the Roborazzi release that moves to it.
      - dependency-name: io.github.sergio-sastre.ComposablePreviewScanner:android
        versions: [">=0.10.0"]
