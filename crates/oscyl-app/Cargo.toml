[package]
name = "oscyl-app"
description = "Shared, UI-free app logic for Oscyl apps: documents, libraries, settings and the synth worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
async-channel = "2.5.0"
oscyl-core = { path = "../oscyl-core" }
oscyl-driver = { path = "../oscyl-driver" }
oscyl-logue = { path = "../drivers/logue" }
oscyl-midi = { path = "../oscyl-midi", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["midir"]
midir = ["oscyl-midi/midir"]

[dev-dependencies]
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
oscyl-minilogue-xd = { path = "../drivers/korg-minilogue-xd" }
