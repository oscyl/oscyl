[package]
name = "oscyl-ffi"
description = "UniFFI bindings (Kotlin, Swift) over Oscyl's shared core, for the mobile apps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["cli"]

[features]
# The bindings generator; host only, never in the mobile library.
cli = ["uniffi/cli"]

[dependencies]
# Pinned: the Kotlin Multiplatform bindings plugin (ch.ubique.uniffi.plugin
# 1.3.x) requires exactly this version.
uniffi = "=0.32.0"
oscyl-app = { path = "../oscyl-app", default-features = false }
oscyl-logue = { path = "../drivers/logue" }
oscyl-core = { path = "../oscyl-core" }
oscyl-driver = { path = "../oscyl-driver" }
oscyl-midi = { path = "../oscyl-midi", default-features = false }
async-channel = "2.5.0"
thiserror.workspace = true
